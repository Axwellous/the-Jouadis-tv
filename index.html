
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>The Jouadis TV — Version 7</title>
<style>
:root{
 --glass:rgba(12,23,43,.65);
 --border:rgba(255,255,255,.26);
 --accent:#b9ddff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080d18;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
button{font:inherit;color:white;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid white;outline-offset:3px}
#bg,#shade{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0;background:linear-gradient(120deg,#17385c,#07101d);background-size:cover;background-position:center;transition:opacity .7s ease,transform 12s linear;transform:scale(1.03)}
#shade{z-index:1;background:linear-gradient(90deg,rgba(3,10,24,.83),rgba(3,10,24,.18) 85%),linear-gradient(0deg,rgba(3,8,20,.83),transparent 55%)}
main{position:relative;z-index:2;width:100%;height:100dvh;min-height:400px;padding:clamp(18px,3vw,42px);display:flex;flex-direction:column;justify-content:space-between}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-family:Georgia,serif;font-style:italic;font-size:clamp(24px,3vw,43px);text-shadow:0 2px 12px #000}
.tagline{font-size:11px;opacity:.85;margin-top:4px}
.clock{text-align:right;font-size:clamp(21px,2.5vw,35px);font-weight:300}
.date{font-size:11px;opacity:.75;margin-top:4px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-height:0;padding:15px 0}
.cityname{font-size:clamp(35px,5vw,67px);font-weight:650;letter-spacing:-2px}
.temp{font-size:clamp(65px,9vw,118px);font-weight:250;line-height:1.15;margin:8px 0}
.condition{font-size:clamp(14px,1.5vw,20px);font-weight:500}
.highlow,.landmark{font-size:12px;margin-top:12px;opacity:.85}
.bottom{display:flex;flex-direction:column;gap:clamp(9px,1.5vh,16px)}
.cities{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.citycard{height:clamp(53px,8vh,90px);border:2px solid var(--border);border-radius:15px;background-size:cover;background-position:center;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.2vw,15px);font-weight:650;text-shadow:0 2px 6px black;transition:transform .2s,border-color .2s}
.citycard:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32)}
.citycard span{position:relative;z-index:1}
.citycard.active{border-color:white;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 20px rgba(130,210,255,.35)}
.citycard:active{transform:scale(.97)}
.dock{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:8px;background:var(--glass);border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 12px 35px rgba(0,0,0,.28)}
.app{height:clamp(51px,8vh,83px);background:rgba(13,32,65,.6);border:1px solid rgba(255,255,255,.3);border-radius:15px;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
.app:hover{transform:translateY(-4px);background:rgba(45,77,120,.75)}
.app svg{width:clamp(24px,3vw,42px);height:clamp(24px,3vw,42px)}
.app img{width:clamp(27px,3.4vw,43px);height:clamp(27px,3.4vw,43px);object-fit:contain}
.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:rgba(12,32,65,.77);padding:6px;border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav button{border:0;background:transparent;border-radius:11px;font-size:clamp(10px,1.1vw,14px);padding:10px 3px;white-space:nowrap}
.nav button.selected{background:rgba(143,194,247,.48)}
.panel{position:fixed;z-index:8;inset:0;background:rgba(0,5,17,.65);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.panel.open{display:flex}
.panelbox{width:min(750px,100%);max-height:85dvh;overflow:auto;background:rgba(14,27,48,.96);border:1px solid var(--border);border-radius:25px;padding:25px;box-shadow:0 20px 70px #0008}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:15px}
.panelhead h2{margin:0;font-size:25px}
.close{border:1px solid var(--border);border-radius:50%;background:#304260;width:40px;height:40px;font-size:22px}
.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}
.day{background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:16px;text-align:center;padding:17px 6px}
.day .emoji{font-size:29px;margin:15px 0}
.day .degrees{font-size:15px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.setting select,.setting button{background:#253c5b;color:white;border:1px solid var(--border);border-radius:12px;padding:10px}
.setting input{accent-color:#9ccfff;max-width:140px}
#screensaver{position:fixed;inset:0;z-index:12;display:none;align-items:flex-end;justify-content:space-between;padding:7vw;background:linear-gradient(0deg,#06101dc9,transparent 70%);cursor:pointer}
#screensaver.show{display:flex}
.savecity{font-size:clamp(36px,6vw,90px);font-weight:650}
.saveclock{font-size:clamp(55px,9vw,130px);font-weight:200}
#toast{position:fixed;z-index:20;left:50%;bottom:25px;transform:translateX(-50%);padding:12px 22px;background:#273e5c;border:1px solid white;border-radius:16px;display:none;text-align:center}
@media(max-width:600px){
 main{padding:15px}
 .brand{font-size:24px}
 .hero{justify-content:center}
 .dock{gap:3px;padding:5px;border-radius:14px}
 .app{border-radius:10px}
 .nav button{font-size:10px}
 .forecast{gap:4px}
 .day{padding:12px 2px;font-size:11px}
 .panelbox{padding:15px}
}
@media(max-height:650px){
 .hero{padding:5px 0}
 .cityname{font-size:35px}
 .temp{font-size:65px;margin:0}
 .highlow,.landmark{margin-top:5px}
 .bottom{gap:6px}
 .citycard{height:51px}
 .app{height:48px}
 .nav button{padding:6px 2px}
}
</style>
</head>
<body>

<div id="bg"></div>
<div id="shade"></div>

<main>
<header>
<div>
<div class="brand">✦ The Jouadis TV</div>
<div class="tagline">Your Family Entertainment</div>
</div>
<div>
<div class="clock" id="clock">--:--</div>
<div class="date" id="date"></div>
</div>
</header>

<section class="hero">
<div class="cityname" id="cityname">Casablanca</div>
<div class="temp" id="temp">--°C</div>
<div class="condition" id="condition">Loading weather...</div>
<div class="highlow" id="highlow"></div>
<div class="landmark" id="landmark"></div>
</section>

<div class="bottom">
<div class="cities" id="cities"></div>

<div class="dock">
<button class="app" title="Netflix" onclick="launch('netflix')">
<svg viewBox="0 0 50 50"><path fill="#e50914" d="M10 5h9l21 35V5h-9v40h-9L10 10v35h9V5z"/></svg>
</button>
<button class="app" title="YouTube" onclick="launch('youtube')">
<svg viewBox="0 0 48 48"><rect x="3" y="10" width="42" height="28" rx="9" fill="#ff0033"/><path d="M20 17l13 7-13 7z" fill="white"/></svg>
</button>
<button class="app" title="Prime Video" onclick="launch('prime')">
<img src="https://cdn.simpleicons.org/amazonprime/00A8E1" alt="Prime Video" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
<span style="display:none;color:#00a8e1;font-weight:bold;font-size:25px">prime</span>
</button>
<button class="app" title="Apple TV" onclick="launch('apple')">
<svg viewBox="0 0 70 42"><path fill="white" d="M16 12c-2-3-1-6 3-8 1 4-1 7-3 8zm1 2c3-2 5-1 7 0-4 4-3 10 1 12-2 5-4 9-7 9-2 0-3-1-5-1s-3 1-5 1C3 30 0 22 3 16c3-5 7-5 10-3 1 1 3 1 4 1z"/><text x="29" y="30" fill="white" font-size="23" font-weight="bold">tv</text></svg>
</button>
<button class="app" title="Disney+" onclick="launch('disney')">
<svg viewBox="0 0 70 45"><path d="M6 18Q35-7 64 18" fill="none" stroke="#8dcaff" stroke-width="2.5"/><text x="8" y="33" fill="white" font-size="23" font-family="Georgia" font-style="italic">D+</text></svg>
</button>
<button class="app" title="Spotify" onclick="launch('spotify')">
<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1ed760"/><path d="M11 18Q24 13 38 20M13 25Q25 21 36 27M15 32Q25 29 34 34" fill="none" stroke="#10251b" stroke-width="3.5" stroke-linecap="round"/></svg>
</button>
<button class="app" title="Shahid" onclick="launch('shahid')">
<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#6638ed"/><path d="M19 13l17 11-17 11z" fill="white"/></svg>
</button>
</div>

<nav class="nav">
<button class="selected" onclick="navigate('Home',this)">⌂ Home</button>
<button onclick="navigate('Movies',this)">▣ Movies</button>
<button onclick="navigate('Series',this)">▤ Series</button>
<button onclick="navigate('Live TV',this)">◉ Live TV</button>
<button onclick="navigate('Music',this)">♫ Music</button>
<button onclick="navigate('Weather',this)">☁ Weather</button>
<button onclick="navigate('Settings',this)">⚙ Settings</button>
</nav>
</div>
</main>

<div class="panel" id="panel" onclick="if(event.target===this)closePanel()">
<div class="panelbox">
<div class="panelhead">
<h2 id="paneltitle">Weather</h2>
<button class="close" onclick="closePanel()">×</button>
</div>
<div id="panelcontent"></div>
</div>
</div>

<div id="screensaver" onclick="exitScreensaver()">
<div>
<div class="savecity" id="savecity"></div>
<div id="saveweather"></div>
</div>
<div class="saveclock" id="saveclock"></div>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";

const cities=[
 {name:"Casablanca",lat:33.5731,lon:-7.5898,zone:"Africa/Casablanca",landmark:"Hassan II Mosque",photo:"images/casablanca.jpg"},
 {name:"Newcastle",lat:54.9783,lon:-1.6178,zone:"Europe/London",landmark:"Tyne Bridge",photo:"images/newcastle.jpg"},
 {name:"London",lat:51.5074,lon:-0.1278,zone:"Europe/London",landmark:"Big Ben",photo:"images/london.jpg"},
 {name:"Manchester",lat:53.4808,lon:-2.2426,zone:"Europe/London",landmark:"Manchester Town Hall",photo:"images/manchester.jpg"}
];

const appUrls={
 netflix:"https://www.netflix.com/",
 youtube:"https://www.youtube.com/",
 prime:"https://www.primevideo.com/",
 apple:"https://tv.apple.com/",
 disney:"https://www.disneyplus.com/",
 spotify:"https://open.spotify.com/",
 shahid:"https://shahid.mbc.net/"
};

const weatherDescriptions={
 0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Cloudy",
 45:"Foggy",48:"Foggy",51:"Light drizzle",53:"Drizzle",55:"Drizzle",
 61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",
 73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",
 82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"
};

let current=0;
let autoTimer=null;
let saverTimer=null;
let saverInterval=null;
let clockTimer=null;
let requestNumber=0;
let lastActivity=Date.now();
let weatherCache={};
let settings={auto:true,saver:true,interval:12,idle:120,brightness:100};
const el=id=>document.getElementById(id);

function toast(message){
 el("toast").textContent=message;
 el("toast").style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>el("toast").style.display="none",3000);
}

function fallbackPhoto(city){
 const gradients=[
 "linear-gradient(125deg,#af8155,#354967,#08111d)",
 "linear-gradient(125deg,#4c7893,#25405d,#091424)",
 "linear-gradient(125deg,#52698b,#28395d,#0b1020)",
 "linear-gradient(125deg,#57356f,#1b2c61,#071126)"
 ];
 return gradients[city]||gradients[0];
}

function photoUrl(city){
 return cities[city].photo;
}

function setBackground(index){
 const url=photoUrl(index);
 const bg=el("bg");
 bg.style.backgroundImage=fallbackPhoto(index);
 bg.style.transform="scale(1.03)";
 const image=new Image();
 image.onload=()=>{
  if(current!==index)return;
  bg.style.backgroundImage=`linear-gradient(rgba(5,12,25,.08),rgba(5,12,25,.08)),url("${url}")`;
  requestAnimationFrame(()=>bg.style.transform="scale(1.10)");
 };
 image.onerror=()=>{
  if(current===index)toast("City image unavailable — check images folder");
 };
 image.src=url;
}

function renderCities(){
 el("cities").innerHTML="";
 cities.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="citycard"+(i===current?" active":"");
  b.style.backgroundImage=fallbackPhoto(i);
  const im=new Image();
  im.onload=()=>b.style.backgroundImage=`linear-gradient(#0002,#0003),url("${c.photo}")`;
  im.src=c.photo;
  const s=document.createElement("span");
  s.textContent=c.name;
  b.appendChild(s);
  b.onclick=()=>selectCity(i,true);
  el("cities").appendChild(b);
 });
}

function selectCity(index,manual=false){
 current=index;
 requestNumber++;
 const c=cities[index];
 el("cityname").textContent=c.name;
 el("landmark").textContent=c.landmark;
 el("savecity").textContent=c.name;
 el("temp").textContent="--°C";
 el("condition").textContent="Loading weather...";
 el("highlow").textContent="";
 setBackground(index);
 renderCities();
 updateClock();
 loadWeather();
 if(manual){
  activity();
  resetRotation();
 }
}

function resetRotation(){
 clearInterval(autoTimer);
 if(settings.auto){
  autoTimer=setInterval(()=>{
   if(!el("panel").classList.contains("open")&&!el("screensaver").classList.contains("show")){
    selectCity((current+1)%cities.length);
   }
  },settings.interval*1000);
 }
}

function updateClock(){
 const now=new Date();
 const zone=cities[current].zone;
 el("clock").textContent=new Intl.DateTimeFormat("en-GB",{
  timeZone:zone,hour:"2-digit",minute:"2-digit",hour12:false
 }).format(now);
 el("date").textContent=new Intl.DateTimeFormat("en-GB",{
  timeZone:zone,weekday:"long",day:"numeric",month:"short",year:"numeric"
 }).format(now);
 el("saveclock").textContent=el("clock").textContent;
}

function weatherEmoji(code){
 if(code===0||code===1)return"☀️";
 if(code===2||code===3)return"☁️";
 if(code===45||code===48)return"🌫️";
 if(code>=51&&code<=82)return"🌧️";
 if(code>=95)return"⛈️";
 return"🌤️";
}

function showWeather(data){
 const t=Math.round(data.current.temperature_2m);
 const code=data.current.weather_code;
 const condition=weatherDescriptions[code]||"Weather";
 el("temp").textContent=t+"°C";
 el("condition").textContent=condition;
 el("highlow").textContent=
 "H: "+Math.round(data.daily.temperature_2m_max[0])+
 "°  L: "+Math.round(data.daily.temperature_2m_min[0])+"°";
 el("saveweather").textContent=t+"°C · "+condition;
 if(el("panel").classList.contains("open")&&el("paneltitle").textContent==="5-Day Forecast"){
  renderForecast();
 }
}

async function loadWeather(){
 const c=cities[current];
 const token=requestNumber;
 const cached=weatherCache[c.name];
 if(cached&&Date.now()-cached.time<600000){
  showWeather(cached.data);
  return;
 }
 try{
  const url="https://api.open-meteo.com/v1/forecast?latitude="+c.lat+
  "&longitude="+c.lon+
  "&current=temperature_2m,weather_code"+
  "&daily=weather_code,temperature_2m_max,temperature_2m_min"+
  "&timezone="+encodeURIComponent(c.zone)+
  "&forecast_days=5";
  const response=await fetch(url);
  if(!response.ok)throw new Error("Weather request failed");
  const data=await response.json();
  weatherCache[c.name]={data,time:Date.now()};
  if(token===requestNumber)showWeather(data);
 }catch(error){
  if(token!==requestNumber)return;
  el("condition").textContent="Weather unavailable";
  el("saveweather").textContent="Weather unavailable";
 }
}

function renderForecast(){
 const c=cities[current];
 const entry=weatherCache[c.name];
 const root=el("panelcontent");
 root.innerHTML="";
 const subtitle=document.createElement("p");
 subtitle.textContent=c.name+" · Local forecast";
 root.appendChild(subtitle);
 if(!entry){
  const p=document.createElement("p");
  p.textContent="Loading forecast...";
  root.appendChild(p);
  return;
 }
 const data=entry.data.daily;
 const grid=document.createElement("div");
 grid.className="forecast";
 for(let i=0;i<Math.min(5,data.time.length);i++){
  const date=new Date(data.time[i]+"T12:00:00Z");
  const day=document.createElement("div");
  day.className="day";
  const name=document.createElement("div");
  name.textContent=new Intl.DateTimeFormat("en-GB",{weekday:"short",timeZone:"UTC"}).format(date);
  const emoji=document.createElement("div");
  emoji.className="emoji";
  emoji.textContent=weatherEmoji(data.weather_code[i]);
  const degrees=document.createElement("div");
  degrees.className="degrees";
  degrees.textContent=Math.round(data.temperature_2m_max[i])+"° / "+Math.round(data.temperature_2m_min[i])+"°";
  day.append(name,emoji,degrees);
  grid.appendChild(day);
 }
 root.appendChild(grid);
}

function openPanel(title){
 el("paneltitle").textContent=title;
 el("panel").classList.add("open");
 activity();
}
function closePanel(){
 el("panel").classList.remove("open");
 activity();
}
function weatherPanel(){
 openPanel("5-Day Forecast");
 renderForecast();
}

function settingRow(label,control){
 const row=document.createElement("div");
 row.className="setting";
 const text=document.createElement("span");
 text.textContent=label;
 row.append(text,control);
 return row;
}
function makeSelect(options,value,callback){
 const s=document.createElement("select");
 options.forEach(([v,label])=>{
  const o=document.createElement("option");
  o.value=v;o.textContent=label;
  s.appendChild(o);
 });
 s.value=String(value);
 s.onchange=()=>callback(s.value);
 return s;
}
function settingsPanel(){
 openPanel("Quick Settings");
 const root=el("panelcontent");
 root.innerHTML="";
 const auto=makeSelect([["true","On"],["false","Off"]],settings.auto,v=>{
  settings.auto=v==="true";resetRotation();
 });
 root.appendChild(settingRow("Automatic city transitions",auto));
 const interval=makeSelect([[12,"12 seconds"],[20,"20 seconds"],[30,"30 seconds"],[60,"60 seconds"]],settings.interval,v=>{
  settings.interval=Number(v);resetRotation();
 });
 root.appendChild(settingRow("City transition interval",interval));
 const saver=makeSelect([["true","On"],["false","Off"]],settings.saver,v=>{
  settings.saver=v==="true";activity();
 });
 root.appendChild(settingRow("Cinematic screensaver",saver));
 const idle=makeSelect([[60,"1 minute"],[120,"2 minutes"],[300,"5 minutes"],[600,"10 minutes"]],settings.idle,v=>{
  settings.idle=Number(v);activity();
 });
 root.appendChild(settingRow("Screensaver after inactivity",idle));
 const brightness=document.createElement("input");
 brightness.type="range";brightness.min=45;brightness.max=100;
 brightness.value=settings.brightness;
 brightness.oninput=()=>{
  settings.brightness=Number(brightness.value);
  el("bg").style.filter="brightness("+(settings.brightness/100)+")";
 };
 root.appendChild(settingRow("Background brightness",brightness));
 const now=document.createElement("button");
 now.textContent="Start screensaver now";
 now.style.marginTop="20px";
 now.style.padding="12px 20px";
 now.style.borderRadius="12px";
 now.style.background="#284b70";
 now.style.border="1px solid white";
 now.onclick=()=>{closePanel();startScreensaver()};
 root.appendChild(now);
}

function launch(app){
 const url=appUrls[app];
 if(url)window.open(url,"_blank","noopener,noreferrer");
 else toast("App unavailable");
 activity();
}

function navigate(section,button){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("selected"));
 button.classList.add("selected");
 activity();
 if(section==="Weather"){weatherPanel();return}
 if(section==="Settings"){settingsPanel();return}
 if(section==="Home"){closePanel();return}
 if(section==="Music"){launch("spotify");return}
 if(section==="Movies"||section==="Series"){
  openPanel(section);
  el("panelcontent").innerHTML="";
  const p=document.createElement("p");
  p.textContent="Choose a streaming service from the glass app dock.";
  el("panelcontent").appendChild(p);
  return;
 }
 if(section==="Live TV")toast("Choose your live TV service from the dock");
}

function activity(){
 lastActivity=Date.now();
 clearTimeout(saverTimer);
 if(settings.saver){
  saverTimer=setTimeout(()=>{
   if(Date.now()-lastActivity>=settings.idle*1000&&!el("panel").classList.contains("open")){
    startScreensaver();
   }
  },settings.idle*1000);
 }
}

function startScreensaver(){
 if(!settings.saver)return;
 el("screensaver").classList.add("show");
 el("savecity").textContent=cities[current].name;
 updateClock();
 clearInterval(saverInterval);
 saverInterval=setInterval(()=>{
  selectCity((current+1)%cities.length);
 },settings.interval*1000);
}
function exitScreensaver(){
 el("screensaver").classList.remove("show");
 clearInterval(saverInterval);
 activity();
 resetRotation();
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  if(el("screensaver").classList.contains("show"))exitScreensaver();
  else closePanel();
 }
 if(e.key==="ArrowRight")selectCity((current+1)%cities.length,true);
 if(e.key==="ArrowLeft")selectCity((current+cities.length-1)%cities.length,true);
});
document.addEventListener("pointerdown",()=>{
 if(!el("screensaver").classList.contains("show"))activity();
},{passive:true});

selectCity(0);
clockTimer=setInterval(updateClock,1000);
resetRotation();
activity();
</script>
</body>
</html>
